name: coder
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/coder/coder:latest
    container_name: coder-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CODER_AGENT_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
      CODER_ACCESS_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
      CODER_PG_CONNECTION_URL: postgres://${DB_USER_NAME:-coder}:${DB_USER_PASS:-replace-with-a-random-password}@coder-db/${DB_CREATE_DATABASE_NAME:-coder}?sslmode=disable
      CODER_TLS: self-signed
      CONTAINER_NAME: coder-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/config/coder:/home/coder/.config'
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7080"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.coder-app.entrypoints=http'
      - 'traefik.http.routers.coder-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`'
      - 'traefik.http.routers.coder-app.middlewares=coder-app-https-redirect'
      - 'traefik.http.middlewares.coder-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.coder-app-secure.entrypoints=https'
      - 'traefik.http.routers.coder-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`'
      - 'traefik.http.routers.coder-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.coder-app-secure.service=coder-app'
      - 'traefik.http.services.coder-app.loadbalancer.server.port=7080'
    networks:
      - coder
      - traefik

  db:
    image: postgres:16
    container_name: coder-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: coder-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-coder}
      POSTGRES_USER: ${DB_USER_NAME:-coder}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      CONTAINER_NAME: coder-db
    volumes:
      - './volumes/data/db/postgres/coder:/var/lib/postgresql/data:z'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - coder

networks:
  coder:
    name: coder
    external: false
  traefik:
    external: true
